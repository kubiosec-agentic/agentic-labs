apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: litellm-poc
  labels:
    app: litellm-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-proxy
  template:
    metadata:
      labels:
        app: litellm-proxy
    spec:
      containers:
        - name: litellm-proxy
          image: litellmpoc-litellm-proxy:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          envFrom:
            - secretRef:
                name: openai-credentials
          volumeMounts:
            - name: proxy-config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: proxy-config
              mountPath: /app/custom_callbacks.py
              subPath: custom_callbacks.py
          livenessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: proxy-config
          configMap:
            name: litellm-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-proxy
  namespace: litellm-poc
spec:
  selector:
    app: litellm-proxy
  ports:
    - port: 4000
      targetPort: 4000
      name: http
  type: ClusterIP
