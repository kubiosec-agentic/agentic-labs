# ── OpenAI API Key Secret ────────────────────────────────────────
# DO NOT commit this file with real values.
#
# Create the secret manually:
#
#   kubectl -n litellm-poc create secret generic openai-credentials \
#     --from-literal=OPENAI_API_KEY='sk-proj-your-key-here' \
#     --from-literal=LITELLM_MASTER_KEY='sk-master-1234'
#
# Or apply this template after base64-encoding your values:
#
#   echo -n 'sk-proj-your-key' | base64
#
apiVersion: v1
kind: Secret
metadata:
  name: openai-credentials
  namespace: litellm-poc
type: Opaque
data:
  # Replace with: echo -n 'YOUR_KEY' | base64
  OPENAI_API_KEY: "REPLACE_WITH_BASE64_ENCODED_KEY"
  LITELLM_MASTER_KEY: "c2stbWFzdGVyLTEyMzQ="  # sk-master-1234
